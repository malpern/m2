# Pin the toolchain to the Node version PRODUCTION runs.
#
# Vercel's project setting for `web` is nodeVersion 24.x, so 24 is what actually
# serves users. CI (.github/workflows/ci.yml) and this file used to pin 22, which
# meant the test suite had never executed on the runtime in production. Aligned
# 2026-09-06, after verifying all 701 tests pass on 24.20.0.
#
# The upper bound matters as much as the pin. package.json's engines.node is
# ">=22.0.0 <25.0.0"; before that bound existed it read ">=22.0.0", which permits
# Node 26 — and under 26 the whole database test suite fails with:
#
#   better_sqlite3.node was compiled against a different Node.js version using
#   NODE_MODULE_VERSION 127. This version of Node.js requires NODE_MODULE_VERSION 147
#
# That names a native module, so it reads like a broken checkout rather than a
# wrong interpreter, and it costs a debugging round every time. 27 tests "failed"
# this way on 2026-08-30.
#
# SWITCHING NODE VERSIONS REQUIRES `npm rebuild better-sqlite3` in web/. The same
# error above appears (with the numbers reversed) if you skip it.
[tools]
node = "24"
